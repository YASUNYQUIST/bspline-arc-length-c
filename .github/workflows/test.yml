name: Build and verify precision
on: [push, pull_request, workflow_dispatch]
jobs:
  numerical:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m pip install -r requirements-test.txt
      - if: runner.os != 'Windows'
        run: python python/verify.py --exe build/bspline_demo --report out/precision_report.json
      - if: runner.os == 'Windows'
        run: python python/verify.py --exe build/Release/bspline_demo.exe --report out/precision_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: precision-${{ matrix.os }}
          path: out/precision_report.json
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBSPLINE_SANITIZE=ON
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
